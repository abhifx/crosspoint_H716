[platformio]
default_envs = crosspoint_h716
# src_dir is managed by scripts/switch_firmware.py (copies to src/)
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.0

[base]
platform = espressif32@6.13.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DXML_GE=1
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -fno-exceptions
  -DFREEINK_DRIVER_FASTEPD=1

build_unflags =
  -std=gnu++11
  -std=gnu++14
  -std=gnu++17
  -std=c++11
  -std=c++14
  -std=c++17

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/merge_bin.py

lib_deps =
  greiman/SdFat @ ^2.3.1
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2
  https://github.com/tonywestonuk/EPD_Painter.git

lib_ignore =

[env:crosspoint_h716]
extends = base
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_LILYGO_H716=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-h716\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DTOUCH_PROBE_DEBUG
lib_ignore = FreeInkDisplay
lib_deps =
  ${base.lib_deps}
  m5stack/M5GFX @ 0.2.20
  h2zero/NimBLE-Arduino @ ^2.3.8
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3

[env:crosspoint_h716_fastepd]
extends = env:crosspoint_h716
build_flags =
  ${env:crosspoint_h716.build_flags}
  -DFREEINK_DRIVER_FASTEPD=1
  -UFREEINK_DRIVER_LGFX_EPD

[env:crosspoint_h716_test]
extends = env:crosspoint_h716
build_flags =
  ${env:crosspoint_h716.build_flags}
  -DTEST_SKETCH
build_src_filter = +<../test_sketch/*.cpp> -<*>
lib_deps =
  ${env:crosspoint_h716.lib_deps}
  https://github.com/tonywestonuk/EPD_Painter.git

[env:grayscale_test]
extends = base
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base.build_flags}
  -DTEST_SKETCH
  -DEPD_PAINTER_PRESET_AUTO
build_src_filter = +<../test_sketch/grayscale_test.cpp> -<*>
lib_deps =
  https://github.com/tonywestonuk/EPD_Painter.git

[env:xteink_h716]
extends = base
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_LILYGO_H716=1
  -DXTEINK_VERSION=\"v1.0.0-h716\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
lib_deps =
  ${base.lib_deps}
  m5stack/M5GFX @ 0.2.20
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3
